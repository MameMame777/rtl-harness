name: "AI の失敗・逸脱"
description: "AI が書いた RTL が規約・お手本から外れた、または要求を満たせなかった"
title: "[deviation] "
labels: ["kind:deviation", "harness", "stage:triage"]
body:
  - type: markdown
    attributes:
      value: |
        社内の RTL や環境情報は **最小再現に削って** 貼ってください（public リポジトリです）。
        `rtl-harness ticket new --kind deviation --attach-last` で下書きを作ると、下の項目が埋まります。
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: 使ったツール / モデル
      options: [claude, copilot, codex, qwen, other]
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: 領域
      options: [bus, cpu, verif]
    validations:
      required: true
  - type: input
    id: harness_version
    attributes:
      label: Harness version
      description: submodule のタグ (例 v0.1.0)
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: 入力した指示
      description: AI に渡した指示（要約可）
    validations:
      required: true
  - type: textarea
    id: rtl
    attributes:
      label: 出力された RTL（最小再現）
      render: systemverilog
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した書き方
      description: どの規則 / お手本に従うべきだったか
    validations:
      required: true
  - type: textarea
    id: tool_json
    attributes:
      label: run_lint / run_sim の結果 (JSON)
      render: json
  - type: checkboxes
    id: promote
    attributes:
      label: 昇格の見立て（任意）
      options:
        - label: 機械判定できそう（rules/ へ昇格候補）
        - label: お手本 / docs の修正で足りそう
        - label: evals の課題にしたい
