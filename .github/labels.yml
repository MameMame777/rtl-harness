# Labels synchronised by .github/workflows/labels-sync.yml (existing labels are never deleted).
# domain:* routes an issue to the domain owners (.github/owners.toml); kind:* comes from the
# issue template; stage:* is managed by the monthly triage.

- name: "domain:bus"
  color: "1d76db"
  description: "BUS domain (AXI4-Lite, valid/ready)"
- name: "domain:cpu"
  color: "5319e7"
  description: "Processor domain (pipeline, hazards)"
- name: "domain:verif"
  color: "0e8a16"
  description: "Verification domain (tb/, mcp/, evals/, CI)"

- name: "kind:deviation"
  color: "d93f0b"
  description: "AI output deviated from the rules or examples"
- name: "kind:rule"
  color: "fbca04"
  description: "Proposal for a new or changed rule"
- name: "kind:tool"
  color: "b60205"
  description: "Bug in run_lint / run_sim / get_waveform / list_design / CLI"
- name: "kind:bug"
  color: "e99695"
  description: "Bug in an example or the harness itself"

- name: "model:claude"
  color: "c5def5"
  description: "Observed with Claude Code"
- name: "model:copilot"
  color: "c5def5"
  description: "Observed with GitHub Copilot"
- name: "model:codex"
  color: "c5def5"
  description: "Observed with Codex CLI (future)"
- name: "model:qwen"
  color: "c5def5"
  description: "Observed with Qwen Code (future)"

- name: "stage:triage"
  color: "ededed"
  description: "Waiting for the monthly triage"
- name: "stage:promote-rules"
  color: "bfd4f2"
  description: "Decided: promote to rules/ (machine-checkable)"
- name: "stage:promote-examples"
  color: "bfd4f2"
  description: "Decided: fix examples/ and docs/"
- name: "stage:evals"
  color: "bfd4f2"
  description: "Decided: add an evals task"

- name: "harness"
  color: "006b75"
  description: "Filed through rtl-harness ticket"
- name: "lint-off-approved"
  color: "5319e7"
  description: "A domain owner approved the lint_off / waiver added in this PR"
- name: "security-audit"
  color: "b60205"
  description: "Opened by the daily security audit workflow"
- name: "dependencies"
  color: "0366d6"
  description: "Dependabot updates"
- name: "ci"
  color: "0366d6"
  description: "CI and workflows"
