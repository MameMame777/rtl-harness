# Secret scan -- required check for every PR and for pushes to main.
# 1. gitleaks (pinned binary, sha256-verified) over the commits being added
# 2. TruffleHog, verified secrets only
# 3. scripts/ci/hygiene.py over the added lines: absolute paths, internal URLs, e-mails, public IPs
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine diff base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            base="HEAD~1"
          else
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "diff base: ${base:-<none: full scan>}"

      - name: Install pinned gitleaks
        run: bash scripts/ci/install_gitleaks.sh

      - name: gitleaks (added commits)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --redact --exit-code 1 --log-opts="$BASE..HEAD" .
          else
            gitleaks git --redact --exit-code 1 .
          fi

      - name: TruffleHog (verified secrets only)
        if: steps.base.outputs.base != ''
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: HEAD
          extra_args: --only-verified

      - name: Hygiene (paths / URLs / e-mails / IPs in added lines)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            python3 scripts/ci/hygiene.py --diff "$BASE...HEAD"
          else
            python3 scripts/ci/hygiene.py --all
          fi
